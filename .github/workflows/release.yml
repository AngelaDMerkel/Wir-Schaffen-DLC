name: Publish native macOS releases

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing published release tag (for example v0.6.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: native-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.version.outputs.commit }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release identity and version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_release.py --check-version --release-tag "$RELEASE_TAG"
          commit=$(git rev-parse HEAD)
          if [[ "$GITHUB_EVENT_NAME" == release && "$commit" != "$GITHUB_SHA" ]]; then
            echo 'Release tag moved after publication.' >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release.json"
          python3 - "$RUNNER_TEMP/release.json" "$RELEASE_TAG" <<'PY'
          import json, sys
          release = json.load(open(sys.argv[1]))
          if release['tag_name'] != sys.argv[2] or release['draft']:
              raise SystemExit('An existing published release with the exact tag is required.')
          if release.get('immutable'):
              raise SystemExit('Published immutable releases cannot accept new assets; upload to a draft before publishing instead.')
          PY
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.asset_architecture }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
            python_architecture: arm64
            asset_architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
            python_architecture: x64
            asset_architecture: amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .github/release-python-version
          architecture: ${{ matrix.python_architecture }}
      - name: Install pinned release tools
        run: python -m pip install --require-hashes -r requirements-release.txt
      - name: Test, build, sign, and verify native artifacts
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          NATIVE_ARCH: ${{ matrix.architecture }}
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: |
          set -euo pipefail
          args=(--architectures "$NATIVE_ARCH" --release-tag "$RELEASE_TAG"
                --arm-python "$(command -v python)" --x86-python "$(command -v python)")
          if [[ "$NATIVE_ARCH" == x86_64 ]]; then
            args+=(--skip-python-distributions)
          fi
          python scripts/build_release.py "${args[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-release-${{ matrix.asset_architecture }}
          path: |
            release/*.zip
            release/*.whl
            release/*.tar.gz
            release/build-info-*.json
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Attach both architectures to the published release
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-release-*
          path: release
          merge-multiple: true
      - name: Verify the combined release and attach downloads
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_release.py --check-version --release-tag "$RELEASE_TAG"
          python3 scripts/prepare_release_assets.py --directory release \
            --tag "$RELEASE_TAG" --commit "$SOURCE_COMMIT" --repository "$GITHUB_REPOSITORY"
          # Never overwrite the bytes of an existing versioned download.
          gh release upload "$RELEASE_TAG" release/* --repo "$GITHUB_REPOSITORY"
          {
            echo "### WSDLC $RELEASE_TAG"
            echo "Built and verified arm64 and amd64 from commit $SOURCE_COMMIT."
            echo "[Release downloads](https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG)"
          } >> "$GITHUB_STEP_SUMMARY"
