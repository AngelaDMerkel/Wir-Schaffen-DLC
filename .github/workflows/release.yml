name: Automatic macOS releases
run-name: Release build · ${{ github.ref_name }}

on:
  push:
    branches:
      - main
      - codex/shared-macos-gamecore
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

# Serialize version allocation through publication. Queue pushes instead of
# replacing an older pending push when another one arrives (GitHub limit: 100).
concurrency:
  group: wsdlc-automatic-release
  cancel-in-progress: false
  # https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency
  queue: max

jobs:
  prepare:
    if: >-
      github.event.deleted != true &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/shared-macos-gamecore')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      source: ${{ steps.plan.outputs.source }}
      commit: ${{ steps.plan.outputs.commit }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Allocate a version and prepare the exact release source
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/automatic_release.py plan --source "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" --run-number "$GITHUB_RUN_NUMBER" \
            --directory "$RUNNER_TEMP/release-plan"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-plan
          path: ${{ runner.temp }}/release-plan/*
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  build:
    name: Build ${{ matrix.asset_architecture }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
            python_architecture: arm64
            asset_architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
            python_architecture: x64
            asset_architecture: amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-plan
          path: ${{ runner.temp }}/release-plan
      - name: Restore the versioned source shared by both architectures
        env:
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          python3 scripts/automatic_release.py restore --directory "$RUNNER_TEMP/release-plan"
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .github/release-python-version
          architecture: ${{ matrix.python_architecture }}
      - name: Install pinned release tools
        run: python -m pip install --require-hashes -r requirements-release.txt
      - name: Test, build, sign, and verify native artifacts
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          NATIVE_ARCH: ${{ matrix.architecture }}
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: |
          set -euo pipefail
          args=(--architectures "$NATIVE_ARCH" --release-tag "$RELEASE_TAG"
                --skip-python-distributions
                --arm-python "$(command -v python)" --x86-python "$(command -v python)")
          python scripts/build_release.py "${args[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-release-${{ matrix.asset_architecture }}
          path: |
            release/*.zip
            release/build-info-*.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  publish:
    name: Publish the complete release
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source }}
          fetch-depth: 0
          # Only this job can publish and synchronize source version metadata.
          persist-credentials: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-plan
          path: ${{ runner.temp }}/release-plan
      - name: Restore the verified release source
        env:
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          python3 scripts/automatic_release.py restore --directory "$RUNNER_TEMP/release-plan"
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-release-*
          path: release
          merge-multiple: true
      - name: Verify both native bundles and their internal build records
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_release.py --check-version --release-tag "$RELEASE_TAG"
          python3 scripts/prepare_release_assets.py --directory release \
            --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --repository "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-verification
          path: |
            release/build-info-*.json
            release/release-manifest.json
            release/SHA256SUMS.txt
          if-no-files-found: error
          overwrite: true
          retention-days: 30
      - name: Publish only the arm64 and amd64 executable bundles
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/automatic_release.py publish --plan "$RUNNER_TEMP/release-plan/plan.json" \
            --assets release --repository "$GITHUB_REPOSITORY"
      - name: Synchronize source versions and README images after publication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/automatic_release.py sync --plan "$RUNNER_TEMP/release-plan/plan.json" \
            --repository "$GITHUB_REPOSITORY" --branch main --branch codex/shared-macos-gamecore
