name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install .
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/render_main_menu.py --check
