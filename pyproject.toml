[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "civ5-mod-dlc-packer"
version = "1.0.1"
description = "Convert Civilization V ModBuddy mods into multiplayer-loadable DLC packages"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Civ5 Mod DLC Packer contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Games/Entertainment :: Turn Based Strategy",
]

[project.scripts]
civ5-dlc-packer = "civ5_dlc_packer:main"
wir-schaffen-dlc = "civ5_dlc_installer:main"

[tool.setuptools]
py-modules = ["civ5_dlc_packer", "civ5_dlc_installer", "civ5_best_mods", "civ5_gamecore"]
