[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "civ5-mod-dlc-packer"
version = "0.1.0"
description = "Convert Civilization V ModBuddy mods into multiplayer-loadable DLC packages"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Civ5 Mod DLC Packer contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Games/Entertainment :: Turn Based Strategy",
]

[project.scripts]
civ5-dlc-packer = "civ5_dlc_packer:main"

[tool.setuptools]
py-modules = ["civ5_dlc_packer"]
